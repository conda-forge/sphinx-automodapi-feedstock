{% set name = "sphinx-automodapi" %}
{% set version = "0.22.0" %}
{% set git_url = "https://github.com/astropy/sphinx-automodapi" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 9a6745d606eb948321f0bb7bd4511dc6d8481da8819caa1604d7138910173b38

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - sphinx >=5

test:
  requires:
    - graphviz
    - pip
    - pytest >=7.0
    - python {{ python_min }}
  imports:
    - sphinx_automodapi
  commands:
    # check metadata
    - python -m pip check sphinx-automodapi
    - python -m pip show sphinx-automodapi
    # run test suite
    - python -m pytest -ra --pyargs sphinx_automodapi -k 'not cython'

about:
  home: {{ git_url }}
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: Sphinx extension for auto-generating API documentation for entire modules
  description: |
    This is a Sphinx extension to automatically generate API pages for whole
    modules.
  doc_url: {{ git_url }}
  dev_url: {{ git_url }}

extra:
  recipe-maintainers:
    - astrofrog
    - mwcraig
    - bsipocz
